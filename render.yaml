# Render.com Configuration File
# This file helps configure your backend deployment on Render
# Place this in the root of your repository

services:
  - type: web
    name: hr-system-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Note: Add other environment variables (MONGODB_URI, JWT_SECRET, etc.) 
    # through the Render dashboard for security

